<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ride Planner</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --verde: #2e9e4f;
    --azul: #1f6fd1;
    --rojo: #d62f2f;
    --negro: #1a1a1a;
    --gris: #9e9e9e;
    --bg: #f7f8fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; height: 100%; }
  #mapwrap { flex: 1; position: relative; }
  #map { position: absolute; inset: 0; }
  #panel {
    width: 360px; background: var(--bg); border-left: 1px solid #e0e0e0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #panel header { padding: 16px; background: #fff; border-bottom: 1px solid #e0e0e0; }
  #panel h1 { font-size: 18px; margin: 0 0 4px; }
  #panel .sub { font-size: 12px; color: #777; }
  #filtros {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #e0e0e0;
  }
  .chip {
    border: 1px solid #ccc; background: #fff; border-radius: 999px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; user-select: none;
  }
  .chip.active { background: #2c3e50; color: #fff; border-color: #2c3e50; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  #lista { flex: 1; overflow-y: auto; padding: 8px; min-height: 120px; }
  .card {
    background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer; border: 1px solid #e6e6e6; transition: border-color .15s;
  }
  .card:hover { border-color: #2c3e50; }
  .card.sel { border-color: #2c3e50; box-shadow: 0 0 0 2px rgba(44,62,80,.15); }
  .card .nom { font-weight: 600; font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .card .nom .txt { flex: 1; }
  .card .meta { font-size: 12px; color: #666; display: flex; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    padding: 1px 6px; border-radius: 4px; background: #ecf0f1; color: #555; font-weight: 500;
  }
  .badge.osm { background: #e8f5e9; color: #2e7d32; }
  .badge.det { background: #fff3e0; color: #e65100; }
  .btn-add {
    flex: none; border: 1px solid #ccc; background: #fff; border-radius: 50%;
    width: 24px; height: 24px; cursor: pointer; font-size: 14px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; color: #333; padding: 0;
  }
  .btn-add:hover { border-color: #2c3e50; }
  .btn-add.in { background: #2c3e50; color: #fff; border-color: #2c3e50; }
  .popup-add {
    margin-top: 8px; width: 100%; padding: 6px;
    border: 1px solid #ccc; background: #fff; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  .popup-add:hover { border-color: #2c3e50; }
  .popup-add.in { background: #2c3e50; color: #fff; border-color: #2c3e50; }
  #ficha {
    position: absolute; bottom: 28px; left: 12px; z-index: 4; display: none;
    width: 290px; max-width: calc(100% - 24px); max-height: calc(100% - 70px); overflow-y: auto;
    background: #fff; padding: 12px 14px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 1px 6px rgba(0,0,0,.3);
  }
  #perfilAlt {
    position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 4; display: none;
    background: rgba(255,255,255,.96); border-top: 1px solid #d0d0d0; box-shadow: 0 -1px 6px rgba(0,0,0,.15);
  }
  #mapwrap.conPerfil #perfilAlt { display: block; }
  #mapwrap.conPerfil .maplibregl-ctrl-bottom-left, #mapwrap.conPerfil .maplibregl-ctrl-bottom-right { bottom: 150px; }
  #mapwrap.conPerfil #ficha { bottom: 162px; max-height: calc(100% - 200px); }
  #perfilAlt .cab { display: flex; align-items: center; gap: 12px; height: 26px; padding: 0 10px 0 14px; font-size: 12px; color: #2c3e50; }
  #perfilAlt .cab #perfilResumen { flex: none; }
  #perfilAlt .cab #perfilInfo { flex: 1; color: #555; font-family: ui-monospace, monospace; text-align: right; white-space: nowrap; overflow: hidden; }
  #perfilAlt .cab button { border: none; background: none; font-size: 18px; line-height: 1; color: #888; cursor: pointer; }
  #perfilAlt .cab button:hover { color: #d62f2f; }
  #perfilGraf { height: 124px; cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; }
  #perfilGraf .vacio { padding: 30px 14px; color: #999; font-size: 12px; }
  #ficha h3 { margin: 0 24px 6px 0; font-size: 15px; }
  #ficha table { border-collapse: collapse; }
  #ficha td { padding: 2px 8px 2px 0; vertical-align: top; }
  #ficha td:first-child { color: #777; }
  #ficha .cerrar {
    position: absolute; top: 6px; right: 8px; border: none; background: none;
    font-size: 20px; line-height: 1; color: #888; cursor: pointer;
  }
  #ficha .cerrar:hover { color: #d62f2f; }
  .maplibregl-popup-content { padding: 12px 14px; border-radius: 8px; font-size: 13px; }
  .maplibregl-popup-content h3 { margin: 0 0 6px; font-size: 15px; }
  .maplibregl-popup-content table { border-collapse: collapse; }
  .maplibregl-popup-content td { padding: 2px 8px 2px 0; vertical-align: top; }
  .maplibregl-popup-content td:first-child { color: #777; }
  #busquedaWrap { position:absolute; z-index:8; top:12px; left:12px; width:min(330px, calc(100% - 24px)); }
  #btnBuscarToggle { width:46px; height:46px; border:0; border-radius:14px; background:#fff; color:#243746; font-size:22px; box-shadow:0 2px 12px rgba(0,0,0,.22); cursor:pointer; touch-action:manipulation; }
  #busquedaPanel { display:none; background:#fff; border-radius:14px; margin-top:7px; padding:8px; box-shadow:0 3px 16px rgba(0,0,0,.2); }
  #busquedaPanel.abierto { display:block; }
  #busquedaInput { width:100%; height:44px; border:1px solid #d4dbe1; border-radius:10px; padding:0 12px; font-size:16px; outline:none; }
  #busquedaInput:focus { border-color:#2c3e50; box-shadow:0 0 0 3px rgba(44,62,80,.12); }
  #busquedaResultados { max-height:220px; overflow:auto; }
  .resultado-busqueda { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid #eef0f2; background:#fff; padding:12px 9px; min-height:44px; font-size:14px; cursor:pointer; touch-action:manipulation; }
  .resultado-busqueda:last-child { border-bottom:0; }
  .resultado-busqueda:active { background:#edf2f6; }
  .resultado-vacio { color:#777; padding:12px 9px; font-size:13px; }
  #ficha { left:12px; bottom:18px; width:260px; max-width:calc(100% - 24px); z-index:7; padding:9px 11px; border-radius:10px; font-size:12px; }
  #ficha h3 { font-size:13px; line-height:1.25; margin-bottom:5px; }
  #ficha table { display:none; }
  #ficha .ficha-resumen { color:#4b5563; font-size:11px; line-height:1.4; margin:0 22px 7px 0; }
  #ficha .cerrar { top:4px; right:6px; font-size:18px; }
  .maplibregl-canvas { touch-action: pan-x pan-y; }
  button, input, select { touch-action: manipulation; }

  /* ===== Panel "Mi ruta" (compacto; en móvil, hoja inferior plegable) ===== */
  #panel > header, #filtros, #lista { display: none !important; }
  #panel {
    width: 340px; background: #f4f6f8; border-left: 1px solid #dfe4e8;
    display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #miRuta { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; box-shadow: -3px 0 18px rgba(20,35,50,.06); }
  #barraRuta { touch-action: none; position: relative; flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #edf0f2; }
  #barraRuta .grip { display: none; position: absolute; top: 7px; left: 50%; width: 44px; height: 5px; border-radius: 2px; background: #d3d9df; transform: translateX(-50%); pointer-events: none; }
  #btnPanelToggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 0; text-align: left; cursor: pointer; font: inherit; color: #243746; }
  #btnPanelToggle { touch-action: none; }
  #btnPanelToggle .chev { flex: none; display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 15px; background: #e8edf1; font-size: 12px; font-weight: 600; color: #243746; }
  #btnPanelToggle .flecha { display: inline-block; font-size: 10px; transition: transform .2s; }
  #miRuta.abierto #btnPanelToggle .flecha { transform: rotate(180deg); }
  .barra-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
  .barra-txt .t1 { font-size: 14px; font-weight: 700; }
  .barra-txt .t1 span { font-weight: 500; color: #6b7280; margin-left: 4px; }
  .barra-txt .tot { font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #btnGenerar { flex: none; min-height: 42px; padding: 0 16px; border: 0; border-radius: 10px; background: #2c3e50; color: #fff; font-size: 14px; font-weight: 650; cursor: pointer; }
  #btnGenerar:hover { background: #1a252f; }
  #btnGenerar:disabled { background: #b4bec3; cursor: not-allowed; }
  #estadoRuta { flex: none; padding: 5px 14px; font-size: 12px; color: #5b6670; background: #fafbfc; border-bottom: 1px solid #edf0f2; }
  #estadoRuta:empty { display: none; }

  #detalleWrap { flex: 1; min-height: 0; display: flex; }
  #detalle { flex: 1; min-width: 0; overflow-y: auto; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .puntoRuta { display: flex; align-items: center; gap: 6px; background: #f7f8fa; border: 1px solid #e6e9ed; border-radius: 10px; padding: 4px 4px 4px 10px; }
  .puntoRuta .ico { flex: none; font-size: 12px; }
  .puntoRuta .txt { flex: 1; min-width: 0; font: 12px ui-monospace, monospace; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .puntoRuta .txt.vacio { color: #8f99a1; font-family: inherit; }
  .puntoRuta button { flex: none; width: 36px; height: 36px; padding: 0; border: 1px solid #d4dbe1; background: #fff; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .puntoRuta button:hover { border-color: #2c3e50; }
  .puntoRuta button.armado { background: #ffd400; border-color: #d4b000; }
  .puntoRuta button.x { color: #d62f2f; font-size: 18px; }
  .fila-opc { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .fila-opc .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #333; min-height: 32px; }
  .fila-opc .check input { width: 18px; height: 18px; }
  .fila-opc .tipo { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
  .fila-opc select { height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid #ccd3d9; font-size: 13px; background: #fff; }
  .sec-titulo { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #6b7280; margin-bottom: -4px; }
  #miRutaLista { display: flex; flex-direction: column; gap: 6px; }
  #miRutaLista .vacio { width: 100%; color: #8a939b; font-size: 12px; padding: 4px 2px; }
  #miRutaLista .item { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 38px; padding: 0 4px 0 10px; border-radius: 12px; background: #f1f4f6; border: 1px solid #e2e7eb; font-size: 13px; cursor: pointer; }
  #miRutaLista .item.punto-inter { background: #f6effa; border-color: #e0cdea; }
  #miRutaLista .item .num { font-weight: 700; color: #8a939b; font-size: 11px; min-width: 14px; }
  #miRutaLista .item .punto { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #miRutaLista .item .pin { flex: none; font-size: 12px; }
  #miRutaLista .item .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #miRutaLista .item button { flex: none; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: none; color: #6b7580; font-size: 13px; cursor: pointer; }
  #miRutaLista .item button:disabled { opacity: .25; cursor: default; }
  #miRutaLista .item { position: relative; transition: transform .15s; }
  #miRutaLista .item .asa { flex: none; width: 22px; height: 34px; display: flex; align-items: center; justify-content: center; margin-left: -4px; color: #9aa4ac; font-size: 15px; letter-spacing: -2px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  #miRutaLista .item.arrastrando { z-index: 3; transition: none; background: #fff; box-shadow: 0 4px 14px rgba(20,35,50,.25); }
  #miRutaLista .item .x { font-size: 18px; }
  #miRutaLista .item .x:hover { color: #d62f2f; background: #fff; }
  .btnInter { min-height: 36px; border: 1px dashed #b9a3c9; background: #faf6fd; border-radius: 8px; font-size: 12px; color: #6a1b9a; cursor: pointer; }
  .btnInter.armado { background: #ffd400; border: 1px solid #d4b000; color: #333; }
  #progresoZona { display: none; flex: none; height: 4px; background: #e6eaee; overflow: hidden; }
  #progresoZona.on { display: block; }
  #progresoZona i { display: block; height: 100%; width: 0; background: #2c7be5; transition: width .25s; }
  #progresoZona.indet i { width: 35%; animation: progIndet 1.1s ease-in-out infinite; }
  @keyframes progIndet { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  #resumenRuta { font-size: 12px; color: #2c3e50; line-height: 1.5; background: #f7f8fa; border-radius: 10px; padding: 8px 10px; }
  #resumenRuta:empty { display: none; }
  #resumenRuta .sw { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin: 0 3px 1px 6px; }
  .acciones { display: flex; gap: 8px; }
  .acciones button { flex: 1; min-height: 36px; border: 1px solid #ccd3d9; background: #fff; border-radius: 8px; font-size: 12px; color: #444; cursor: pointer; }
  .acciones button:hover { border-color: #2c3e50; }
  .acciones button.peligro { color: #d62f2f; border-color: #e7b4b4; }
  .acciones button.peligro:hover { background: #d62f2f; border-color: #d62f2f; color: #fff; }
  #btnDescargarGPX { display: none !important; }

  @media (min-width: 721px) {
    #btnPanelToggle { pointer-events: none; cursor: default; }
    #btnPanelToggle .chev { display: none; }
  }
  @media (max-width: 720px) {
    #app { flex-direction: column; }
    #mapwrap { flex: 1; min-height: 0; height: auto; }
    #panel { width: 100%; flex: none; border-left: 0; border-top: 1px solid #dfe4e8; box-shadow: 0 -4px 16px rgba(20,35,50,.12); }
    #miRuta { flex: none; }
    #barraRuta { padding: 20px 12px 10px; }
    #barraRuta .grip { display: block; }
    #detalleWrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
    #miRuta.abierto #detalleWrap { grid-template-rows: 1fr; }
    #detalle { min-height: 0; overflow: hidden; padding: 0 12px; }
    #miRuta.abierto #detalle { overflow-y: auto; max-height: 46vh; max-height: 46dvh; padding: 10px 12px 12px; }
    #ficha { bottom: 10px; max-height: 48%; width: min(330px, calc(100% - 24px)); }
    #mapwrap.conPerfil #ficha { bottom: 162px; max-height: calc(100% - 200px); }
    #busquedaWrap { top: 10px; left: 10px; width: min(340px, calc(100% - 64px)); }
    #btnBuscarToggle { width: 44px; height: 44px; }
    #busquedaPanel { margin-top: 6px; }
    #busquedaResultados { max-height: 150px; }
  }

  /* ===== Cargar zona ===== */
  #btnZona {
    position: absolute; top: 12px; left: 66px; z-index: 9; height: 46px; padding: 0 16px;
    border: 0; border-radius: 14px; background: #2c3e50; color: #fff; font-size: 14px; font-weight: 650;
    box-shadow: 0 2px 12px rgba(0,0,0,.28); cursor: pointer; touch-action: manipulation;
  }
  #btnZona:hover { background: #1a252f; }
  #btnZona:disabled { background: #7d8a96; cursor: progress; }
  @media (max-width: 720px) {
    #btnZona { top: 10px; left: 62px; height: 44px; padding: 0 14px; }
  }
</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#1688e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ride Planner">
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <div id="map"></div>
    <div id="busquedaWrap">
      <button id="btnBuscarToggle" aria-label="Buscar bajada" title="Buscar bajada">⌕</button>
      <div id="busquedaPanel">
        <input id="busquedaInput" type="search" placeholder="Buscar bajada por nombre…" autocomplete="off" />
        <div id="busquedaResultados" aria-live="polite"></div>
      </div>
    </div>
    <button id="btnZona" type="button" title="Descarga las bajadas MTB de OpenStreetMap que se ven en el mapa">Cargar esta zona</button>
    <div id="ficha"></div>
    <div id="perfilAlt">
      <div class="cab"><span id="perfilResumen"></span><span id="perfilInfo"></span><button id="perfilCerrar" title="Ocultar perfil">×</button></div>
      <div id="perfilGraf"></div>
    </div>
  </div>
  <aside id="panel">
    <div id="miRuta">
      <div id="barraRuta">
        <span class="grip"></span>
        <button id="btnPanelToggle" type="button" aria-expanded="false" aria-controls="detalle">
          <span class="barra-txt">
            <span class="t1">Mi ruta <span id="miRutaContador">0 bajadas</span></span>
            <span class="tot" id="miRutaTotales">Sin bajadas todavía</span>
          </span>
        </button>
        <button id="btnGenerar" disabled>Generar ruta</button>
      </div>
      <div id="estadoRuta"></div>
      <div id="progresoZona"><i></i></div>
      <div id="detalleWrap">
        <div id="detalle">
          <div class="fila-opc">
            <label class="check" for="volverInicio" title="Al final, volver al primer punto o bajada de la lista"><input type="checkbox" id="volverInicio" checked />Ruta circular</label>
            <label class="tipo" for="perfil" title="Solo afecta a los enlaces entre bajadas, no a las bajadas">Modo de enrutamiento
			<select id="perfil">
              <option value="trekking">Trekking</option>
              <option value="safety">Safety (evita carreteras)</option>
              <option value="mtb">MTB</option>
              <option value="gravel">Gravel</option>
              <option value="fastbike">Fastbike</option>
              <option value="fastbike-verylowtraffic">Fastbike muy poco tráfico</option>
              <option value="hiking-mountain">Senderismo de montaña</option>
              <option value="shortest">Más corto</option>
              <option value="__otro__">Otro (escribir nombre)…</option>
            </select>
            </label>
          </div>
          <div class="sec-titulo">Ruta: bajadas y puntos (arrastra ⋮⋮ para ordenar)</div>
          <div id="miRutaLista"></div>
          <div id="resumenRuta"></div>
          <button id="btnDescargarGPX" disabled style="display:none">Descargar GPX</button>
          <div class="acciones">
            <button id="btnBorrarTodo" type="button" class="peligro" title="Quita bajadas, inicio, fin y ruta generada">Empezar de cero</button>
          </div>
        </div>
      </div>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="osm.js"></script>
<script src="elevacion.js"></script>
<script src="ruta.js"></script>
<script>
const COLORES = { verde: "#2e9e4f", azul: "#1f6fd1", rojo: "#d62f2f", negro: "#1a1a1a", sin: "#9e9e9e" };
const CATS = ["verde", "azul", "rojo", "negro", "sin"];

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: { osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, attribution: "© OpenStreetMap contributors" } },
    layers: [{ id: "osm", type: "raster", source: "osm" }]
  },
  center: [2.33, 41.52],
  zoom: 12,
  customAttribution: 'Elevación: Copernicus DEM vía <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>'
});

map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: true, showUserLocation: true, showAccuracyCircle: true
}), "top-right");   // botón ◎ + punto azul con tu ubicación
map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-right");

let features = [];                 // bajadas cargadas (se rehace en actualizarMapa)
const porId = new Map();           // id -> feature de la bajada
const tramosPorId = new Map();     // id -> trozos coloreados para dibujarla
let descartadas = new Set();       // ids que el perfil completo ha desmentido
let seleccionada = null;
let cargandoZona = false;

function cargarMiRutaGuardado() {
  try {
    const rd = localStorage.getItem(STORAGE_DESCARTADAS);
    if (rd) descartadas = new Set(JSON.parse(rd));
    // Las bajadas de la ruta se guardan enteras (con su perfil): sobreviven a un refresco sin volver a descargar la zona
    const rb = localStorage.getItem(STORAGE_BAJADAS);
    if (rb) {
      for (const [id, b] of Object.entries(JSON.parse(rb))) {
        if (b && b.f && b.f.properties && b.f.properties.perfil_cargado) { porId.set(id, b.f); tramosPorId.set(id, b.tramos || []); }
      }
    }
    const rp = localStorage.getItem(STORAGE_INTER);
    if (rp) for (const [id, pt] of JSON.parse(rp)) puntosInter.set(id, pt);
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const ids = JSON.parse(raw); if (Array.isArray(ids)) miRuta = ids.filter(id => porId.has(id) || puntosInter.has(id)); }
    localStorage.removeItem(STORAGE_INICIO); localStorage.removeItem(STORAGE_FIN);
  } catch (e) {}
}
function guardarMiRuta() {
  invalidarRuta();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(miRuta));
    const o = {};
    for (const id of miRuta) { const f = porId.get(id); if (f) o[id] = { f, tramos: tramosPorId.get(id) || [] }; }
    localStorage.setItem(STORAGE_BAJADAS, JSON.stringify(o));
    for (const id of [...puntosInter.keys()]) if (!miRuta.includes(id)) puntosInter.delete(id);
    localStorage.setItem(STORAGE_INTER, JSON.stringify([...puntosInter]));
  } catch (e) {}
}
function guardarPuntos() {
  invalidarRuta();
  try {
    if (puntoInicio) localStorage.setItem(STORAGE_INICIO, JSON.stringify(puntoInicio)); else localStorage.removeItem(STORAGE_INICIO);
    if (puntoFin) localStorage.setItem(STORAGE_FIN, JSON.stringify(puntoFin)); else localStorage.removeItem(STORAGE_FIN);
  } catch (e) {}
}
function estaEnRuta(id) { return miRuta.includes(id); }
async function toggleRuta(id) {
  const i = miRuta.indexOf(id);
  if (i >= 0) {
    miRuta.splice(i, 1);
  } else {
    const f = porId.get(id); if (!f) return;
    if (!f.properties.perfil_cargado) {   // el perfil hace falta para la ruta: se pide al añadir
      const btn = document.getElementById("popupAdd");
      if (btn && btn.dataset.id === id) { btn.disabled = true; btn.textContent = "Calculando perfil…"; }
      setEstado(`Calculando el perfil de «${f.properties.nombre || "bajada"}»…`);
      let ok = false;
      try { ok = await asegurarPerfil(id); }
      catch (e) { setEstado("No se pudo calcular el perfil: " + e.message); actualizarPopupBoton(); return; }
      if (!ok) { actualizarPopupBoton(); return; }   // retirada: asegurarPerfil ya avisó
      setEstado("");
    }
    if (!miRuta.includes(id)) miRuta.push(id);
  }
  guardarMiRuta(); renderMiRuta(); actualizarBotonesRuta(); actualizarPopupBoton(); actualizarBotonGenerar();
}

// Ordenar la lista arrastrando el asa ⋮⋮ (ratón o dedo)
function arrastrarItem(ev, asa, cont, el, i) {
  if (ev.button !== undefined && ev.button !== 0) return;
  ev.preventDefault(); ev.stopPropagation();
  const items = [...cont.querySelectorAll(".item")];
  const scroller = document.getElementById("detalle");
  const mids = items.map(x => { const r = x.getBoundingClientRect(); return r.top + r.height / 2; });
  const paso = el.getBoundingClientRect().height + 6;
  const y0 = ev.clientY, s0 = scroller.scrollTop;
  let destino = i, yAct = y0;
  try { asa.setPointerCapture(ev.pointerId); } catch (e) {}
  el.classList.add("arrastrando");
  const pinta = () => {
    const desp = (yAct - y0) + (scroller.scrollTop - s0);
    el.style.transform = `translateY(${desp}px)`;
    const centro = mids[i] + desp;
    let d = 0;
    mids.forEach((m, j) => { if (j !== i && m < centro) d++; });
    destino = d;
    items.forEach((x, j) => {
      if (j === i) return;
      x.style.transform = (j > i && j <= destino) ? `translateY(${-paso}px)` : (j < i && j >= destino) ? `translateY(${paso}px)` : "";
    });
  };
  let auto = null;
  const mueve = (e) => {
    yAct = e.clientY; pinta();
    const r = scroller.getBoundingClientRect();
    clearInterval(auto);
    if (yAct < r.top + 36) auto = setInterval(() => { scroller.scrollTop -= 8; pinta(); }, 16);
    else if (yAct > r.bottom - 36) auto = setInterval(() => { scroller.scrollTop += 8; pinta(); }, 16);
  };
  const suelta = () => {
    clearInterval(auto);
    asa.removeEventListener("pointermove", mueve);
    asa.removeEventListener("pointerup", suelta);
    asa.removeEventListener("pointercancel", suelta);
    if (destino !== i) {
      const [x] = miRuta.splice(i, 1); miRuta.splice(destino, 0, x);
      guardarMiRuta(); renderMiRuta();
    } else {
      el.classList.remove("arrastrando"); el.style.transform = "";
      items.forEach(x => { x.style.transform = ""; });
    }
  };
  asa.addEventListener("pointermove", mueve);
  asa.addEventListener("pointerup", suelta);
  asa.addEventListener("pointercancel", suelta);
}

function moverEnRuta(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= miRuta.length) return;
  [miRuta[i], miRuta[j]] = [miRuta[j], miRuta[i]];
  guardarMiRuta(); renderMiRuta();
}

function actualizarMarcadoresInter() {
  markersInter.forEach(m => m.remove()); markersInter = [];
  let n = 0;
  for (const id of miRuta) {
    if (!esPunto(id)) continue;
    const pt = puntosInter.get(id); if (!pt) continue;
    n++;
    const el = document.createElement("div");
    el.textContent = n;
    el.style.cssText = "width:24px;height:24px;border-radius:50%;background:#7b1fa2;color:#fff;font:700 12px/20px system-ui,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)";
    markersInter.push(new maplibregl.Marker({ element: el }).setLngLat([pt[1], pt[0]]).addTo(map));
  }
}

function renderMiRuta() {
  const cont = document.getElementById("miRutaLista");
  cont.innerHTML = "";
  let longTotal = 0, caidaTotal = 0, nBaj = 0, nPun = 0;
  if (miRuta.length === 0) {
    const v = document.createElement("div"); v.className = "vacio"; v.textContent = "Carga una zona, toca una bajada y pulsa «＋ Añadir a mi ruta»"; cont.appendChild(v);
  } else {
    miRuta.forEach((id, i) => {
      const esP = esPunto(id);
      const f = esP ? null : porId.get(id);
      if (!esP && !f) return;
      const el = document.createElement("div"); el.className = "item" + (esP ? " punto-inter" : "");
      let marca, nombre;
      if (esP) { nPun++; marca = `<span class="pin">📍</span>`; const pt = puntosInter.get(id); nombre = (pt && pt[2]) ? pt[2] : `Punto ${nPun}`; }
      else {
        nBaj++;
        const p = f.properties;
        longTotal += p.longitud_m || 0; caidaTotal += p.caida_m || 0;
        marca = `<span class="punto" style="background:${colorDe(p)}"></span>`; nombre = p.nombre || "(sin nombre)";
      }
      el.innerHTML = `<span class="asa" title="Arrastra para ordenar" aria-label="Arrastrar para ordenar">⋮⋮</span><span class="num">${i + 1}</span>${marca}<span class="nom">${esc(nombre)}</span>`
        + `<button class="x" title="Quitar" aria-label="Quitar">×</button>`;
      const asa = el.querySelector(".asa");
      asa.addEventListener("click", (ev) => ev.stopPropagation());
      asa.addEventListener("pointerdown", (ev) => arrastrarItem(ev, asa, cont, el, i));
      el.querySelector(".x").addEventListener("click", (ev) => { ev.stopPropagation(); toggleRuta(id); });
      el.addEventListener("click", () => {
        setPanel(false);
        if (esP) { const pt = puntosInter.get(id); if (pt) map.easeTo({ center: [pt[1], pt[0]], zoom: Math.max(map.getZoom(), 14), duration: 500 }); }
        else seleccionar(id, { fit: true });
      });
      cont.appendChild(el);
    });
  }
  document.getElementById("miRutaContador").textContent = `${nBaj} bajada${nBaj === 1 ? "" : "s"}`;
  document.getElementById("miRutaTotales").textContent = nBaj === 0 ? (nPun ? `${nPun} punto${nPun === 1 ? "" : "s"} intermedio${nPun === 1 ? "" : "s"}` : "Sin bajadas todavía")
    : `${fmtLong(Math.round(longTotal))} de bajada · ↓${Math.round(caidaTotal)} m` + (nPun ? ` · ${nPun} punto${nPun === 1 ? "" : "s"}` : "");
  actualizarMarcadoresInter();
}

// Nombre legible de un sitio (calle + localidad, o el lugar si lo tiene) con Nominatim / OpenStreetMap
async function nombreDeLugar(lat, lon) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 4000);
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=es&lat=${lat}&lon=${lon}`, { signal: ctrl.signal });
    if (!r.ok) return null;
    const j = await r.json(), ad = j.address || {};
    const sitio = j.name || ad.road || ad.path || ad.track || ad.neighbourhood || ad.suburb || null;
    const zona = ad.village || ad.town || ad.city || ad.hamlet || ad.municipality || ad.county || null;
    const partes = [sitio, zona].filter((x, i, a) => x && a.indexOf(x) === i);
    return partes.length ? partes.join(", ") : null;
  } catch (e) { return null; }
  finally { clearTimeout(t); }
}

function esc(t) { return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const idDe = f => f.properties.id;
const catDe = p => p.dificultad_color || "sin";
const colorDe = p => COLORES[catDe(p)];
function fmtLong(m) { return m >= 1000 ? (m / 1000).toFixed(2).replace(".", ",") + " km" : m + " m"; }
async function fetchJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.json(); }
function badgeFiab(p) { return p.fiabilidad === "osm" ? `<span class="badge osm">OSM</span>` : `<span class="badge det">detectada</span>`; }

// ---- Caché en el móvil: todas las bajadas cargadas se guardan en IndexedDB y reaparecen al abrir la app ----
const IDB_NOMBRE = "ridebajadas_v1";
const IDB_TTL_MS = 30 * 24 * 3600 * 1000;   // pasado este tiempo se vuelven a descargar (OSM cambia)
const tiempoCarga = new Map();               // id -> momento en que se descargó
function idbAbrir() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("sin IndexedDB"));
    const r = indexedDB.open(IDB_NOMBRE, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("datos");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
let idbTimer = null;
let guardadoPendiente = false;
let cargaLocalTerminada = false;   // no se guarda nada hasta haber leído lo que había (evita machacarlo con un mapa vacío)
async function volcarBajadasLocal() {
  if (!cargaLocalTerminada) return;
  guardadoPendiente = false;
  try {
    const db = await idbAbrir();
    const ahora = Date.now(), o = {};
    for (const [id, f] of porId) o[id] = { t: tiempoCarga.get(id) || ahora, f, tramos: tramosPorId.get(id) || [] };
    await new Promise((res, rej) => {
      const tx = db.transaction("datos", "readwrite");
      tx.objectStore("datos").put(o, "bajadas");
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error || new Error("error al escribir"));
      tx.onabort = () => rej(tx.error || new Error("escritura cancelada"));
    });
    db.close();
  } catch (e) {
    console.error("No se pudieron guardar las bajadas en el móvil:", e);
    setEstado("⚠ No se han podido guardar las bajadas en el móvil (" + (e && e.message || e) + "). Si abres la app desde otra app (WhatsApp, GitHub…) ábrela en Chrome/Safari.");
  }
}
function guardarBajadasLocal() {
  guardadoPendiente = true;
  clearTimeout(idbTimer);
  idbTimer = setTimeout(volcarBajadasLocal, 300);
}
// En el móvil, al cambiar de app o cerrar, los temporizadores se congelan: se guarda en ese momento
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && guardadoPendiente) { clearTimeout(idbTimer); volcarBajadasLocal(); } });
window.addEventListener("pagehide", () => { if (guardadoPendiente) { clearTimeout(idbTimer); volcarBajadasLocal(); } });
// Pide al navegador que no borre estos datos cuando necesite espacio
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
async function cargarBajadasLocales() {
  try {
    const db = await idbAbrir();
    const o = await new Promise(res => {
      const q = db.transaction("datos").objectStore("datos").get("bajadas");
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
    db.close();
    if (!o) return 0;
    const ahora = Date.now();
    let n = 0;
    for (const [id, b] of Object.entries(o)) {
      if (!b || !b.f || descartadas.has(id) || ahora - b.t > IDB_TTL_MS) continue;
      porId.set(id, b.f); tramosPorId.set(id, b.tramos || []); tiempoCarga.set(id, b.t); n++;
    }
    return n;
  } catch (e) { console.error("No se pudieron leer las bajadas guardadas:", e); return 0; }
}

// Vuelca las bajadas cargadas (y sus trozos de color y extremos) a las capas del mapa
function actualizarMapa() {
  features = [...porId.values()];
  const tr = { type: "FeatureCollection", features: [] };
  const pt = { type: "FeatureCollection", features: [] };
  for (const f of features) {
    const p = f.properties, id = idDe(f);
    for (const t of tramosPorId.get(id) || []) tr.features.push(t);
    const base = { _cat: p._cat, _osm: p._osm, _color: colorDe(p), bajada_id: id, nombre: p.nombre || "" };
    pt.features.push({ type: "Feature", geometry: { type: "Point", coordinates: p.inicio }, properties: { ...base, tipo: "inicio" } });
    pt.features.push({ type: "Feature", geometry: { type: "Point", coordinates: p.fin }, properties: { ...base, tipo: "final" } });
  }
  const st = map.getSource("tramos"), sp = map.getSource("puntos");
  if (st) st.setData(tr);
  if (sp) sp.setData(pt);
}

// Barra de progreso + tiempo transcurrido mientras se carga la zona (frac = null => barra indeterminada)
function iniciarProgreso(btn) {
  const barra = document.getElementById("progresoZona"), relleno = barra.firstElementChild;
  const t0 = Date.now(), textoBtn = btn.textContent;
  let msg = "", frac = null;
  barra.classList.add("on");
  function pinta() {
    const seg = Math.round((Date.now() - t0) / 1000);
    setEstado(`${msg} · ${seg} s`);
    btn.textContent = frac === null ? `Cargando… ${seg} s` : `Cargando… ${Math.round(frac * 100)} %`;
    barra.classList.toggle("indet", frac === null);
    relleno.style.width = frac === null ? "" : (frac * 100).toFixed(0) + "%";
  }
  const iv = setInterval(pinta, 500);
  return {
    set(m, f) { msg = m; frac = (typeof f === "number" && isFinite(f)) ? Math.max(0, Math.min(1, f)) : null; pinta(); },
    fin() { clearInterval(iv); barra.classList.remove("on", "indet"); relleno.style.width = "0"; btn.textContent = textoBtn; }
  };
}

// ---- Cargar la zona visible: senderos MTB de OSM + sentido por la elevación de los extremos ----
document.getElementById("btnZona").addEventListener("click", cargarZona);

async function cargarZona() {
  if (cargandoZona) return;
  const b = map.getBounds();
  const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()];
  const area = OSM.areaKm2(bbox);
  if (area > OSM.MAX_AREA_KM2) {
    setEstado(`La zona visible es muy grande (${Math.round(area)} km²). Acerca el mapa (máximo ${OSM.MAX_AREA_KM2} km²).`);
    return;
  }
  cargandoZona = true;
  const btn = document.getElementById("btnZona");
  btn.disabled = true;
  const prog = iniciarProgreso(btn);
  try {
    prog.set("Buscando bajadas en la zona…");
    // osm.js informa del servidor al que se conecta: se oculta y se muestra un texto sobre las bajadas
    const sinServidor = (m) => /overpass|servidor|mirror|https?:|\.(de|fr|ru|ch|org|com|net)\b|conect|reintent/i.test(String(m || "")) ? "Buscando bajadas en la zona…" : m;
    const cand = await OSM.descargarZona(bbox, (m, f) => prog.set(sinServidor(m), f));
    const nuevos = cand.filter(c => !porId.has(c.id) && !descartadas.has(c.id));
    if (!nuevos.length) {
      setEstado(cand.length ? "Todas las bajadas de esta zona ya estaban cargadas." : "No hay senderos con etiquetas MTB en esta zona.");
      return;
    }
    prog.set(`${nuevos.length} bajada${nuevos.length === 1 ? "" : "s"} encontrada${nuevos.length === 1 ? "" : "s"} · comprobando el sentido…`);
    const extremos = [];
    for (const c of nuevos) extremos.push(c.pts[0], c.pts[c.pts.length - 1]);
    await Elev.obtener(extremos, (hecho, total) => {
      const fr = total ? hecho / total : null;
      prog.set(`${nuevos.length} bajadas encontradas · comprobando sentido: ${fr === null ? 0 : Math.min(nuevos.length, Math.round(fr * nuevos.length))}/${nuevos.length}`, fr);
    });
    let validas = 0, dudosas = 0;
    for (const c of nuevos) {
      const ini = c.pts[0], fin = c.pts[c.pts.length - 1];
      const r = OSM.evaluar(c, Elev.ele(ini[0], ini[1]), Elev.ele(fin[0], fin[1]));
      if (!r) { dudosas++; continue; }   // ante la duda, no se muestra
      porId.set(c.id, r.feature); tramosPorId.set(c.id, r.tramos); tiempoCarga.set(c.id, Date.now()); validas++;
    }
    actualizarMapa();
    guardarBajadasLocal();
    setEstado(validas
      ? `${validas} bajada${validas === 1 ? "" : "s"} cargada${validas === 1 ? "" : "s"} · ${dudosas} descartada${dudosas === 1 ? "" : "s"} por sentido dudoso`
      : `No hay bajadas nuevas con sentido fiable (${dudosas} descartada${dudosas === 1 ? "" : "s"} por sentido dudoso).`);
  } catch (e) {
    console.error(e);
    setEstado("Error: " + e.message);
  } finally {
    prog.fin();
    cargandoZona = false;
    btn.disabled = false;
  }
}

// ---- Perfil completo de una bajada (se pide al abrirla o al añadirla a la ruta) ----
function asegurarPerfil(id) {
  const f = porId.get(id);
  if (!f) return Promise.resolve(false);
  if (f.properties.perfil_cargado) return Promise.resolve(true);
  if (perfilesEnCurso.has(id)) return perfilesEnCurso.get(id);
  const prom = (async () => {
    try {
      const r = await Elev.cargarPerfil(f);
      if (!r.ok) { descartarBajada(id, r.motivo); return false; }
      guardarBajadasLocal();   // el perfil cambia la geometría: se actualiza la copia del móvil
      return true;
    } finally {
      perfilesEnCurso.delete(id);
    }
  })();
  perfilesEnCurso.set(id, prom);
  return prom;
}

function descartarBajada(id, motivo) {
  const f = porId.get(id);
  const nombre = f && f.properties.nombre ? `«${f.properties.nombre}»` : "Una bajada";
  porId.delete(id); tramosPorId.delete(id); tiempoCarga.delete(id); descartadas.add(id);
  guardarBajadasLocal();
  try { localStorage.setItem(STORAGE_DESCARTADAS, JSON.stringify([...descartadas])); } catch (e) {}
  if (seleccionada === id) deseleccionar();
  const i = miRuta.indexOf(id);
  if (i >= 0) { miRuta.splice(i, 1); guardarMiRuta(); renderMiRuta(); actualizarBotonGenerar(); }
  actualizarMapa();
  setEstado(`${nombre} se ha retirado: ${motivo}.`);
}

function cargarIcono(nombre, color) {
  return new Promise((resolve) => {
    if (map.hasImage(nombre)) return resolve();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" rx="2" fill="${color}" stroke="#ffffff" stroke-width="3"/></svg>`;
    const img = new Image(32, 32);
    img.onload = () => { if (!map.hasImage(nombre)) map.addImage(nombre, img); resolve(); };
    img.onerror = () => resolve();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

async function cargarCapas() {
  map.addSource("tramos", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "tramos-halo", type: "line", source: "tramos", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#ffffff", "line-width": 8, "line-opacity": 0.6 } });
  map.addLayer({ id: "tramos-sel", type: "line", source: "tramos", filter: ["==", ["get", "bajada_id"], ""], layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#ffd400", "line-opacity": 0.9, "line-width": ["interpolate", ["linear"], ["zoom"], 10, 6, 14, 10, 17, 14] } });
  map.addLayer({ id: "tramos-line", type: "line", source: "tramos", layout: { "line-cap": "butt", "line-join": "round" }, paint: { "line-color": ["get", "stroke"], "line-width": ["interpolate", ["linear"], ["zoom"], 10, 2, 14, 4, 17, 7] } });
  // Capa invisible más ancha para facilitar el toque sin engordar el trazo visible.
  map.addLayer({ id: "tramos-hit", type: "line", source: "tramos", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#000000", "line-opacity": 0.01, "line-width": ["interpolate", ["linear"], ["zoom"], 10, 10, 14, 14, 17, 18] } }, "tramos-line");

  map.addSource("puntos", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "puntos-inicio", type: "circle", source: "puntos", filter: ["==", ["get", "tipo"], "inicio"], paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 4, 16, 5], "circle-color": "#ffffff", "circle-stroke-color": ["get", "_color"], "circle-stroke-width": 2 } });
  await Promise.all(CATS.map(c => cargarIcono("cuadrado-" + c, COLORES[c])));
  map.addLayer({ id: "puntos-final", type: "symbol", source: "puntos", filter: ["==", ["get", "tipo"], "final"], layout: { "icon-image": ["concat", "cuadrado-", ["get", "_cat"]], "icon-size": ["interpolate", ["linear"], ["zoom"], 10, 0.3, 14, 0.45, 17, 0.65], "icon-allow-overlap": true, "icon-ignore-placement": true } });

  crearFlecha();
  map.addSource("sel-flechas", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "sel-flechas", type: "symbol", source: "sel-flechas", layout: { "symbol-placement": "line", "symbol-spacing": 55,
    "icon-image": "flecha-ruta", "icon-size": ["interpolate", ["linear"], ["zoom"], 10, 0.35, 14, 0.5, 17, 0.7],
    "icon-rotation-alignment": "map", "icon-allow-overlap": true, "icon-ignore-placement": true } }, "puntos-inicio");

  let ultimoToque = 0;
  const clic = (e) => {
    if (modoMarcar || !e.features || !e.features.length) return;
    if (Date.now() - ultimoToque < 650) return;
    ultimoToque = Date.now();
    const id = e.features[0].properties.bajada_id;
    seleccionar(id, { lngLat: e.lngLat });
  };
  map.on("click", "tramos-hit", clic);
  map.on("click", "tramos-line", clic);
  map.on("click", "puntos-inicio", clic);
  map.on("click", "puntos-final", clic);
  // En móvil solo interpretamos como selección un toque breve y casi inmóvil.
  // Los arrastres para mover el mapa no deben abrir fichas.
  let toqueInicio = null;
  map.on("touchstart", (e) => {
    if (!e.point || (e.originalEvent && e.originalEvent.touches && e.originalEvent.touches.length > 1)) { toqueInicio = null; return; }
    toqueInicio = { x: e.point.x, y: e.point.y, t: Date.now() };
  });
  map.on("touchend", (e) => {
    if (modoMarcar || !e.point || !toqueInicio) { toqueInicio = null; return; }
    const dx = e.point.x - toqueInicio.x, dy = e.point.y - toqueInicio.y, dt = Date.now() - toqueInicio.t;
    toqueInicio = null;
    if (Math.hypot(dx, dy) > 9 || dt > 500 || map.isMoving()) return;
    const p = e.point, pad = 10;
    const caja = [[p.x-pad, p.y-pad], [p.x+pad, p.y+pad]];
    const encontrados = map.queryRenderedFeatures(caja, { layers: ["tramos-hit", "tramos-line", "puntos-inicio", "puntos-final"] });
    const elegido = encontrados.find(f => f.properties && f.properties.bajada_id);
    if (!elegido) return;
    ultimoToque = Date.now();
    seleccionar(elegido.properties.bajada_id, { lngLat: e.lngLat });
  });
  ["tramos-hit", "tramos-line", "puntos-inicio", "puntos-final"].forEach(layer => {
    map.on("mouseenter", layer, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", layer, () => map.getCanvas().style.cursor = "");
  });
}

function seleccionar(id, opts = {}) {
  const f = porId.get(id); if (!f) return;
  if (typeof cerrarPopupPunto === "function") cerrarPopupPunto();
  seleccionada = id;
  map.setFilter("tramos-sel", ["==", ["get", "bajada_id"], id]);
  const sf = map.getSource("sel-flechas");
  if (sf) sf.setData({ type: "Feature", properties: {}, geometry: f.geometry });
  const p = f.properties;
  let lngLat = opts.lngLat || { lng: p.inicio[0], lat: p.inicio[1] };
  if (opts.fit) {
    const b = new maplibregl.LngLatBounds(); f.geometry.coordinates.forEach(c => b.extend([c[0], c[1]]));
    const centro = b.getCenter();
    map.fitBounds(b, { padding: { top: 90, bottom: 90, left: 90, right: 90 }, maxZoom: 15, duration: 650 });
    lngLat = { lng: centro.lng, lat: centro.lat };
  }
  mostrarPopup(f, lngLat);
  if (!p.perfil_cargado) {   // el perfil completo llega después de abrir la ficha
    asegurarPerfil(id).then(ok => {
      if (!ok || seleccionada !== id) return;
      const g = porId.get(id); if (!g) return;
      const s2 = map.getSource("sel-flechas");
      if (s2) s2.setData({ type: "Feature", properties: {}, geometry: g.geometry });
      mostrarPopup(g, lngLat);
    }).catch(e => {
      console.error(e);
      if (seleccionada === id && porId.has(id)) mostrarPopup(porId.get(id), lngLat, "No se pudo calcular el perfil: " + e.message);
    });
  }
}

function mostrarPopup(f, lngLat, aviso) {
  const p = f.properties; const color = colorDe(p);
  let dif = p.dificultad_color ? `<span style="color:${color};font-weight:600">${esc(p.dificultad_color)}</span>` : `<span style="color:#95a5a6">sin dificultad en OSM</span>`;
  const det = p.dificultad_detalle_m || {};
  if (Object.keys(det).length > 1) {
    const partes = Object.entries(det).sort((a, b) => b[1] - a[1]).map(([c, m]) => `${esc(c)} ${m} m`).join(" · ");
    dif += `<br><span style="color:#777;font-size:12px">${partes}</span>`;
  }
  const fila = (k, v) => (v === null || v === undefined || v === "") ? "" : `<tr><td>${k}</td><td>${v}</td></tr>`;
  const id = idDe(f);
  const dentro = estaEnRuta(id);
  const cargado = !!p.perfil_cargado;
  const asc = cargado ? Math.round(Number(p.ascenso_m) || 0) : 0;
  let resumen = `${fmtLong(Math.round(Number(p.longitud_m) || 0))} · ↓${Math.round(Number(p.caida_m) || 0)} m${asc > 0 ? ` · ↑${asc} m` : ""} · ${p.pendiente_media_pct} %`;
  resumen += `<br>Inicio ${p.elev_inicio_m} m → fin ${p.elev_final_m} m`;
  if (aviso) resumen += `<br><span style="color:#b3261e">${esc(aviso)}</span>`;
  else if (!cargado) resumen += `<br><span style="color:#8a939b">Calculando perfil…</span>`;

  const ficha = document.getElementById("ficha");
  ficha.innerHTML = `
      <button class="cerrar" title="Cerrar">×</button>
      <h3>${esc(p.nombre || "(sin nombre)")} ${badgeFiab(p)}</h3>
      <div class="ficha-resumen">${resumen}</div>
      <table>
        ${fila("Dificultad", dif)}
        ${fila("Longitud", fmtLong(p.longitud_m))}
        ${fila("Caída", p.caida_m + " m")}
        ${fila("Pend. media", p.pendiente_media_pct + " %")}
        ${fila("Pend. máx 100 m", cargado ? p.pendiente_max_100m_pct + " %" : null)}
        ${fila("Tipo", esc(p.mtb_type))}
        ${fila("Superficie", esc(p.surface))}
        ${fila("Tramos OSM", p.n_tramos)}
      </table>
      <button class="popup-add ${dentro ? "in" : ""}" id="popupAdd" data-id="${id}">
        ${dentro ? "✓ Quitar de mi ruta" : "＋ Añadir a mi ruta"}
      </button>`;
  ficha.style.display = "block";
  ficha.scrollTop = 0;
  ficha.querySelector(".cerrar").addEventListener("click", deseleccionar);
  document.getElementById("popupAdd").addEventListener("click", (ev) => { ev.stopPropagation(); toggleRuta(id); });
}

function deseleccionar() {
  seleccionada = null;
  document.getElementById("ficha").style.display = "none";
  if (map.getLayer("tramos-sel")) map.setFilter("tramos-sel", ["==", ["get", "bajada_id"], ""]);
  const src = map.getSource("sel-flechas");
  if (src) src.setData({ type: "FeatureCollection", features: [] });
  document.querySelectorAll(".card.sel").forEach(c => c.classList.remove("sel"));
}

function ajustarVista() {
  const b = new maplibregl.LngLatBounds();
  // Con la caché local puede haber bajadas de varias zonas: se encuadra la ruta o, si no hay, la última zona cargada
  let lista = miRuta.filter(id => !esPunto(id)).map(id => porId.get(id)).filter(Boolean);
  if (!lista.length) {
    const ultimo = Math.max(0, ...features.map(f => tiempoCarga.get(idDe(f)) || 0));
    lista = features.filter(f => ultimo - (tiempoCarga.get(idDe(f)) || 0) < 2 * 3600 * 1000);
  }
  if (!lista.length) lista = features;
  lista.forEach(f => f.geometry.coordinates.forEach(c => b.extend([c[0], c[1]])));
  if (!b.isEmpty()) map.fitBounds(b, { padding: 60, duration: 0 });
}

// ---- Ruta generada: dibujar, invalidar, descargar, borrar todo ----
function crearFlecha() {
  if (map.hasImage("flecha-ruta")) return;
  const s = 32, c = document.createElement("canvas"); c.width = c.height = s;
  const g = c.getContext("2d");
  g.beginPath(); g.moveTo(6, 6); g.lineTo(27, 16); g.lineTo(6, 26); g.lineTo(12, 16); g.closePath();
  g.lineJoin = "round"; g.lineWidth = 3; g.strokeStyle = "#1a1a1a"; g.stroke();
  g.fillStyle = "#ffffff"; g.fill();
  map.addImage("flecha-ruta", g.getImageData(0, 0, s, s));
}

function dibujarRuta(segmentos) {
  const feats = [];
  let prev = null;
  for (const s of segmentos) {
    const coords = s.puntos.map(p => [p[1], p[0]]);
    if (prev) coords.unshift(prev); // une con el segmento anterior sin huecos
    prev = coords[coords.length - 1];
    if (coords.length > 1) feats.push({ type: "Feature", properties: { tipo: s.tipo, nombre: s.nombre }, geometry: { type: "LineString", coordinates: coords } });
  }
  const data = { type: "FeatureCollection", features: feats };
  if (map.getSource("ruta-generada")) {
    map.getSource("ruta-generada").setData(data);
  } else {
    crearFlecha();
    const esBajada = ["==", ["get", "tipo"], "bajada"], esEnlace = ["==", ["get", "tipo"], "enlace"];
    const cap = { "line-cap": "round", "line-join": "round" };
    map.addSource("ruta-generada", { type: "geojson", data });
    // contorno morado bajo las bajadas de la ruta (conservan su color de dificultad)
    map.addLayer({ id: "ruta-bajadas-contorno", type: "line", source: "ruta-generada", filter: esBajada, layout: cap,
      paint: { "line-color": COLOR_RUTA, "line-width": ["interpolate", ["linear"], ["zoom"], 10, 7, 14, 11, 17, 15] } },
      map.getLayer("tramos-sel") ? "tramos-sel" : undefined);
    const antes = map.getLayer("puntos-inicio") ? "puntos-inicio" : undefined;
    // enlaces: línea morada con borde blanco
    map.addLayer({ id: "ruta-enlaces-borde", type: "line", source: "ruta-generada", filter: esEnlace, layout: cap, paint: { "line-color": "#ffffff", "line-width": 9 } }, antes);
    map.addLayer({ id: "ruta-enlaces", type: "line", source: "ruta-generada", filter: esEnlace, layout: cap, paint: { "line-color": COLOR_RUTA, "line-width": 5 } }, antes);
    // flechas de sentido a lo largo de toda la ruta
    map.addLayer({ id: "ruta-flechas", type: "symbol", source: "ruta-generada",
      layout: { "symbol-placement": "line", "symbol-spacing": 70, "icon-image": "flecha-ruta",
        "icon-size": ["interpolate", ["linear"], ["zoom"], 10, 0.35, 14, 0.5, 17, 0.7],
        "icon-rotation-alignment": "map", "icon-allow-overlap": true, "icon-ignore-placement": true } });
  }
  const bnd = new maplibregl.LngLatBounds();
  feats.forEach(f => f.geometry.coordinates.forEach(c => bnd.extend(c)));
  if (!bnd.isEmpty()) map.fitBounds(bnd, { padding: 70, duration: 600 });
}

function mostrarResumenRuta(st) {
  const km = m => fmtLong(Math.round(m));
  let t = `<strong>${km(st.distM)}</strong>`;
  if (st.sube !== null) t += ` · ↑${st.sube} m ↓${st.baja} m`;
  t += `<br>Bajadas ${km(st.distBajadasM)} (contorno morado) · <span class="sw" style="background:${COLOR_RUTA};margin-left:0"></span>enlaces ${km(st.distEnlacesM)}`
     + `<br>Las flechas ➤ marcan el sentido.`;
  document.getElementById("resumenRuta").innerHTML = t;
}

// ---- Perfil de altimetría ----
function construirPerfil(segmentos) {
  const pts = [];
  let d = 0, prev = null, eleAnt = null;
  for (const s of segmentos) for (const p of s.puntos) {
    if (prev) d += haversine([prev[0], prev[1]], [p[0], p[1]]);
    prev = p;
    const ele = (p[2] === null || p[2] === undefined) ? eleAnt : p[2];
    if (ele !== null) eleAnt = ele;
    pts.push({ d, ele, lat: p[0], lon: p[1], color: s.color });
  }
  const primero = pts.find(q => q.ele !== null);
  pts.forEach(q => { if (q.ele === null) q.ele = primero ? primero.ele : null; });
  if (!primero) return { pts: [], total: d };
  const MAX = 800, paso = Math.ceil(pts.length / MAX);
  const red = pts.filter((q, i) => i % paso === 0 || i === pts.length - 1);
  return { pts: red, total: d };
}

// Sitúa cada punto elegido (en orden) sobre el recorrido: distancia acumulada donde la ruta pasa por él
function ubicarPuntosEnPerfil(pts, puntos) {
  const dist = (q, p) => Math.hypot((q.lat - p.lat) * 111320, (q.lon - p.lon) * 111320 * Math.cos(p.lat * Math.PI / 180));
  const res = []; let desde = 0;
  puntos.forEach((p, k) => {
    let mejor = -1, mejorD = Infinity;
    for (let i = desde; i < pts.length; i++) { const d = dist(pts[i], p); if (d < mejorD) { mejorD = d; mejor = i; } }
    for (let i = desde; i < pts.length; i++) {          // primer paso por el punto (no uno posterior más cercano por casualidad)
      if (dist(pts[i], p) < 40) {
        let j = i; while (j + 1 < pts.length && dist(pts[j + 1], p) < dist(pts[j], p)) j++;
        mejor = j; break;
      }
    }
    if (mejor < 0) return;
    desde = mejor;
    res.push({ d: pts[mejor].d, n: k + 1, nombre: p.nombre });
  });
  return res;
}

function mostrarPerfil(segmentos, st, puntosSel = []) {
  const { pts, total } = construirPerfil(segmentos);
  perfilDatos = pts.length > 1 ? pts : null;
  perfilPuntos = perfilDatos ? ubicarPuntosEnPerfil(pts, puntosSel) : [];
  let t = `<strong>${fmtLong(Math.round(total))}</strong>`;
  if (st.sube !== null) t += ` · ↑${st.sube} m ↓${st.baja} m`;
  document.getElementById("perfilResumen").innerHTML = t;
  document.getElementById("perfilInfo").textContent = "";
  document.getElementById("mapwrap").classList.add("conPerfil");
  dibujarPerfil();
}

function ocultarPerfil() {
  perfilDatos = null; perfilGeom = null; perfilPuntos = [];
  document.getElementById("mapwrap").classList.remove("conPerfil");
  document.getElementById("perfilGraf").innerHTML = "";
  if (markerPerfil) markerPerfil.getElement().style.display = "none";
}

function dibujarPerfil() {
  const cont = document.getElementById("perfilGraf");
  if (!perfilDatos) { cont.innerHTML = '<div class="vacio">Sin datos de altitud para dibujar el perfil.</div>'; return; }
  const pts = perfilDatos, W = cont.clientWidth, H = cont.clientHeight;
  if (!W || !H) return;
  const ML = 44, MR = 12, MT = 8, MB = 18, total = pts[pts.length - 1].d || 1;
  let lo = Infinity, hi = -Infinity;
  pts.forEach(q => { if (q.ele < lo) lo = q.ele; if (q.ele > hi) hi = q.ele; });
  let emin = lo, emax = hi;
  if (emax - emin < 20) { const c = (emax + emin) / 2; emin = c - 10; emax = c + 10; }
  const pad = (emax - emin) * 0.08; emin -= pad; emax += pad;
  const X = d => ML + d / total * (W - ML - MR);
  const Y = e => MT + (1 - (e - emin) / (emax - emin)) * (H - MT - MB);
  perfilGeom = { ML, MR, W, total };

  let s = `<svg width="${W}" height="${H}" style="display:block">`;
  for (const e of [lo, (lo + hi) / 2, hi]) {
    s += `<line x1="${ML}" x2="${W - MR}" y1="${Y(e).toFixed(1)}" y2="${Y(e).toFixed(1)}" stroke="#e3e3e3"/>`
       + `<text x="${ML - 5}" y="${(Y(e) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#777">${Math.round(e)} m</text>`;
  }
  const km = total / 1000; let paso = 0.5;
  for (const c of [0.5, 1, 2, 5, 10, 20, 50]) { paso = c; if (km / c <= 8) break; }
  for (let k = 0; k * paso * 1000 <= total; k++) {
    const x = X(k * paso * 1000).toFixed(1);
    s += `<line x1="${x}" x2="${x}" y1="${MT}" y2="${H - MB}" stroke="#f0f0f0"/>`
       + `<text x="${x}" y="${H - 4}" text-anchor="middle" font-size="10" fill="#777">${String(k * paso).replace(".", ",")}${k === 0 ? " km" : ""}</text>`;
  }
  const area = pts.map(q => `${X(q.d).toFixed(1)},${Y(q.ele).toFixed(1)}`);
  s += `<polygon points="${X(0)},${H - MB} ${area.join(" ")} ${X(total)},${H - MB}" fill="rgba(44,62,80,.10)"/>`;
  // línea por tramos de color (bajadas con su dificultad, enlaces en morado)
  let run = [], col = null;
  const cierra = () => { if (run.length > 1) s += `<polyline points="${run.join(" ")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`; };
  pts.forEach((q, i) => {
    const c = q.color || COLOR_RUTA, p = `${X(q.d).toFixed(1)},${Y(q.ele).toFixed(1)}`;
    if (c !== col) { cierra(); run = i > 0 ? [`${X(pts[i - 1].d).toFixed(1)},${Y(pts[i - 1].ele).toFixed(1)}`] : []; col = c; }
    run.push(p);
  });
  cierra();
  // puntos elegidos por el usuario (mismo número y color que en el mapa)
  for (const pp of perfilPuntos) {
    const x = X(pp.d).toFixed(1);
    s += `<g><title>${esc(pp.nombre || "Punto " + pp.n)}</title>`
       + `<line x1="${x}" x2="${x}" y1="${MT}" y2="${H - MB}" stroke="${COLOR_RUTA}" stroke-width="1.5" stroke-dasharray="4 3"/>`
       + `<circle cx="${x}" cy="${MT + 9}" r="9" fill="${COLOR_RUTA}" stroke="#fff" stroke-width="2"/>`
       + `<text x="${x}" y="${MT + 13}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${pp.n}</text></g>`;
  }
  s += `<line id="pfLinea" y1="${MT}" y2="${H - MB}" stroke="#555" stroke-dasharray="3 3" style="display:none"/>`
     + `<circle id="pfPunto" r="4.5" fill="#fff" stroke="#1a1a1a" stroke-width="2" style="display:none"/></svg>`;
  cont.innerHTML = s;
  perfilGeom.X = X; perfilGeom.Y = Y;
}

function hoverPerfil(ev) {
  if (!perfilDatos || !perfilGeom) return;
  const cont = document.getElementById("perfilGraf"), g = perfilGeom, pts = perfilDatos;
  const r = cont.getBoundingClientRect();
  let d = (ev.clientX - r.left - g.ML) / (g.W - g.ML - g.MR) * g.total;
  d = Math.max(0, Math.min(g.total, d));
  let a = 0, b = pts.length - 1;
  while (b - a > 1) { const m = (a + b) >> 1; if (pts[m].d < d) a = m; else b = m; }
  const i = (d - pts[a].d < pts[b].d - d) ? a : b, q = pts[i];
  let i0 = i, i1 = i;
  while (i0 > 0 && q.d - pts[i0].d < 30) i0--;
  while (i1 < pts.length - 1 && pts[i1].d - q.d < 30) i1++;
  const dd = pts[i1].d - pts[i0].d;
  const pend = dd > 5 ? (pts[i1].ele - pts[i0].ele) / dd * 100 : null;
  const linea = document.getElementById("pfLinea"), punto = document.getElementById("pfPunto");
  if (linea && punto) {
    const x = g.X(q.d).toFixed(1);
    linea.setAttribute("x1", x); linea.setAttribute("x2", x); linea.style.display = "";
    punto.setAttribute("cx", x); punto.setAttribute("cy", g.Y(q.ele).toFixed(1)); punto.style.display = "";
  }
  document.getElementById("perfilInfo").textContent =
    `km ${(q.d / 1000).toFixed(2).replace(".", ",")} · ${Math.round(q.ele)} m` + (pend !== null ? ` · ${pend > 0 ? "+" : pend < 0 ? "−" : ""}${Math.abs(pend).toFixed(0)} %` : "");
  if (!markerPerfil) {
    const el = document.createElement("div");
    el.style.cssText = "width:18px;height:18px;border-radius:50%;background:#ffd400;border:3px solid #1a1a1a;box-shadow:0 0 0 2px #fff;pointer-events:none;z-index:5";
    markerPerfil = new maplibregl.Marker({ element: el }).setLngLat([q.lon, q.lat]).addTo(map);
  }
  markerPerfil.setLngLat([q.lon, q.lat]);
  markerPerfil.getElement().style.display = "";
  // que la bola se vea siempre: dentro del mapa y por encima del perfil de altimetría
  const cm = map.getContainer(), px = map.project([q.lon, q.lat]), panel = document.getElementById("perfilAlt");
  const mx = 40, arriba = 80, abajo = cm.clientHeight - (panel ? panel.offsetHeight : 0) - 40;
  let dx = 0, dy = 0;
  if (px.x < mx) dx = px.x - mx; else if (px.x > cm.clientWidth - mx) dx = px.x - (cm.clientWidth - mx);
  if (px.y < arriba) dy = px.y - arriba; else if (px.y > abajo) dy = px.y - abajo;
  if (dx || dy) map.panBy([dx, dy], { duration: 0 });
}
function salirPerfil() {
  const linea = document.getElementById("pfLinea"), punto = document.getElementById("pfPunto");
  if (linea) linea.style.display = "none";
  if (punto) punto.style.display = "none";
  document.getElementById("perfilInfo").textContent = "";
  if (markerPerfil) markerPerfil.getElement().style.display = "none";
}
const perfilGrafEl = document.getElementById("perfilGraf");
perfilGrafEl.addEventListener("pointerdown", (ev) => {
  try { perfilGrafEl.setPointerCapture(ev.pointerId); } catch (e) {}   // sigue el dedo aunque se salga del gráfico
  hoverPerfil(ev);
});
perfilGrafEl.addEventListener("pointermove", hoverPerfil);
perfilGrafEl.addEventListener("pointerleave", (ev) => { if (ev.pointerType === "mouse") salirPerfil(); });   // en táctil la bola se queda al soltar
document.getElementById("perfilCerrar").addEventListener("click", () => {
  document.getElementById("mapwrap").classList.remove("conPerfil"); salirPerfil();
});
window.addEventListener("resize", () => { if (perfilDatos && document.getElementById("mapwrap").classList.contains("conPerfil")) dibujarPerfil(); });

// Quita la ruta calculada (porque algo ha cambiado o se empieza de cero)
function invalidarRuta() {
  versionRuta++;
  const hab = rutaGenerada !== null;
  rutaGenerada = null;
  const src = map.getSource("ruta-generada");
  if (src) src.setData({ type: "FeatureCollection", features: [] });
  document.getElementById("resumenRuta").innerHTML = "";
  document.getElementById("btnDescargarGPX").disabled = true;
  document.getElementById("btnGenerar").textContent = "Generar ruta";
  ocultarPerfil();
  if (hab) document.getElementById("estadoRuta").textContent = "";
}

document.getElementById("btnGenerar").addEventListener("click", async () => {
  if (rutaGenerada) { descargarRuta(); return; }
  if (!miRuta.some(id => !esPunto(id))) return;
  let nPunto = 0;
  const seleccion = miRuta.map(id => {
    if (esPunto(id)) { const pt = puntosInter.get(id); return pt ? { punto: true, lat: pt[0], lon: pt[1], nombre: (pt[2] || `Punto ${++nPunto}`) } : null; }
    return porId.get(id);
  }).filter(Boolean);
  const soloBajadas = seleccion.filter(x => !x.punto);
  const perfil = document.getElementById("perfil").value;
  const btn = document.getElementById("btnGenerar");
  const estado = document.getElementById("estadoRuta");
  const volver = document.getElementById("volverInicio").checked;
  const primero = seleccion[0];
  const inicioRuta = primero.punto ? [primero.lat, primero.lon]
    : (primero.properties.inicio ? [primero.properties.inicio[1], primero.properties.inicio[0]]
      : [primero.geometry.coordinates[0][1], primero.geometry.coordinates[0][0]]);
  const fin = volver ? inicioRuta : null;   // circular: vuelve al primer punto/bajada de la lista
  invalidarRuta();
  setPanel(false);
  const version = versionRuta;
  btn.disabled = true;
  estado.textContent = "Iniciando...";
  try {
    const todasLasBajadas = [...porId.values()];   // todas las bajadas cargadas: BRouter evita subir por ellas
    const r = await window.generarRutaGPX(seleccion, null, fin, perfil, (msg) => { if (version === versionRuta) estado.textContent = msg; }, todasLasBajadas);
    if (version !== versionRuta) { estado.textContent = "La selección cambió mientras se calculaba. Vuelve a generar."; return; }
    rutaGenerada = r;
    let bi = 0;
    r.segmentos.forEach(sg => { sg.color = sg.tipo === "bajada" ? colorDe(soloBajadas[bi++].properties) : COLOR_RUTA; });
    dibujarRuta(r.segmentos);
    mostrarPerfil(r.segmentos, r.stats, seleccion.filter(x => x.punto));
    mostrarResumenRuta(r.stats);
    document.getElementById("btnDescargarGPX").disabled = false;
    document.getElementById("btnGenerar").textContent = "⬇ Descargar GPX";
    const sinEvitar = r.segmentos.filter(sg => sg.tipo === "enlace" && sg.conNogo === false).length;
    estado.textContent = "Ruta lista. Revísala en el mapa y descarga el GPX."
      + (sinEvitar ? ` ⚠ ${sinEvitar} enlace${sinEvitar === 1 ? "" : "s"} no ha${sinEvitar === 1 ? "" : "n"} podido evitar subir por alguna bajada.` : "");
  } catch (e) {
    estado.textContent = "Error: " + e.message;
    console.error(e);
  } finally {
    actualizarBotonGenerar();
  }
});

function descargarRuta() {
  if (!rutaGenerada) return;
  const hoy = new Date(), z = n => String(n).padStart(2, "0");
  window.descargarGPX(rutaGenerada.gpx, `ruta-${hoy.getFullYear()}-${z(hoy.getMonth() + 1)}-${z(hoy.getDate())}.gpx`);
  document.getElementById("estadoRuta").textContent = "GPX descargado ✓";
}
document.getElementById("btnDescargarGPX").addEventListener("click", descargarRuta);

document.getElementById("btnBorrarTodo").addEventListener("click", () => {
  if (miRuta.length === 0 && !puntoInicio && !puntoFin && !rutaGenerada) return;
  if (!confirm("¿Borrar bajadas, inicio, fin y ruta generada, y empezar de cero?")) return;
  cerrarPopupPunto();
  miRuta.length = 0; puntoInicio = null; puntoFin = null;
  guardarMiRuta(); guardarPuntos(); invalidarRuta();
  document.getElementById("volverInicio").checked = true;
  document.getElementById("perfil").value = "trekking";
  deseleccionar();
  renderMiRuta(); actualizarBotonesRuta(); actualizarPopupBoton(); actualizarUIPuntos();
  document.getElementById("estadoRuta").textContent = "";
  ajustarVista();
});
</script>
